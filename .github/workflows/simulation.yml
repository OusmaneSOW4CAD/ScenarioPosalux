name: Simulation

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run Simulation
      run: python simulations/fake_ansys.py

    - name: Publish Result
      run: python integration/publish_to_codebeamer.py
