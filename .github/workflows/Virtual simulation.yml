name: Virtual Simulation

on:
  workflow_dispatch:

jobs:
  simulation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run fake ansys
      run: python simulations/fake_ansys.py

    - name: Publish result
      run: python integration/publish_to_codebeamer.py
